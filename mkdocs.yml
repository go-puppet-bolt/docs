site_name: go-puppet-bolt docs
site_description: "go-puppet-bolt — a pure-Go (CGO_ENABLED=0) port of the core of Puppet Bolt: inventory, tasks and YAML plans run over a pluggable transport, with no Ruby runtime."
site_url: https://go-puppet-bolt.github.io/docs/
repo_url: https://github.com/go-puppet-bolt
repo_name: go-puppet-bolt
edit_uri: ""

theme:
  name: material
  logo: assets/logo.svg
  favicon: assets/logo.svg
  features:
    - navigation.sections
    - navigation.top
    - navigation.instant
    - content.code.copy
    - search.suggest
  palette:
    - media: "(prefers-color-scheme)"
      toggle:
        icon: material/brightness-auto
        name: Switch to light mode
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      toggle:
        icon: material/brightness-4
        name: Switch to system preference

extra:
  version:
    provider: mike
    default: latest

nav:
  - Home: index.md
  - Why pure Go: why.md
  - Inventory, tasks & plans: model.md
  - Usage & API: api.md
  - Roadmap: roadmap.md
  - Contributing: contributing.md

markdown_extensions:
  - admonition
  - attr_list
  - def_list
  - footnotes
  - tables
  - toc:
      permalink: true
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.superfences
  - pymdownx.inlinehilite
